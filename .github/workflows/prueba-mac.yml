name: Prueba Mac
# Prueba temporal: ¿GitHub asigna equipos Mac a esta cuenta en un repositorio público? Se borra al terminar.
on: workflow_dispatch
jobs:
  probar:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    steps:
      - run: uname -a
